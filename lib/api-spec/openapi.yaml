openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Auction Hub API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: auctions
    description: Auction operations
  - name: bids
    description: Bid operations
  - name: users
    description: User operations
  - name: categories
    description: Category operations
  - name: storage
    description: Object storage upload and serving endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # CATEGORIES
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # AUCTIONS
  /auctions:
    get:
      operationId: listAuctions
      tags: [auctions]
      summary: List auctions with filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"

    post:
      operationId: createAuction
      tags: [auctions]
      summary: Create a new auction (seller only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBody"
      responses:
        "201":
          description: Auction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auctions/{id}:
    get:
      operationId: getAuction
      tags: [auctions]
      summary: Get auction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateAuction
      tags: [auctions]
      summary: Update auction (seller only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuctionBody"
      responses:
        "200":
          description: Auction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/accept-winner:
    post:
      operationId: acceptWinner
      tags: [auctions]
      summary: Seller accepts highest bidder as winner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptWinnerBody"
      responses:
        "200":
          description: Winner accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  # BIDS
  /auctions/{id}/bids:
    get:
      operationId: listBids
      tags: [bids]
      summary: List bids for an auction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"

    post:
      operationId: placeBid
      tags: [bids]
      summary: Place a bid on an auction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBidBody"
      responses:
        "201":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # SELLER endpoints
  /seller/auctions:
    get:
      operationId: listSellerAuctions
      tags: [auctions]
      summary: List seller's own auctions
      responses:
        "200":
          description: Seller auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"

  /seller/sold-items:
    get:
      operationId: listSellerSoldItems
      tags: [auctions]
      summary: List seller's sold auctions with buyer info
      responses:
        "200":
          description: Sold items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoldItem"

  /seller/stats:
    get:
      operationId: getSellerStats
      tags: [auctions]
      summary: Get seller dashboard stats
      responses:
        "200":
          description: Seller stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStats"

  # BUYER endpoints
  /buyer/bids:
    get:
      operationId: listBuyerBids
      tags: [bids]
      summary: List all bids placed by current buyer
      responses:
        "200":
          description: Buyer bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidWithAuction"

  /buyer/won:
    get:
      operationId: listBuyerWonAuctions
      tags: [bids]
      summary: List auctions won by buyer
      responses:
        "200":
          description: Won auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"

  # Dashboard / wow endpoints
  /auctions/stats/summary:
    get:
      operationId: getAuctionsSummary
      tags: [auctions]
      summary: Get live auction summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionsSummary"

  /auctions/activity/recent:
    get:
      operationId: getRecentActivity
      tags: [auctions]
      summary: Get recent bid activity across all auctions
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # STORAGE endpoints
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [buyer, seller, both]
        rating:
          type: number
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, role, rating, createdAt]

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [buyer, seller, both]
      required: [email, password, name, role]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        auctionCount:
          type: integer
      required: [id, name, slug, icon, auctionCount]

    Auction:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        startingPrice:
          type: number
        currentBid:
          type: number
        bidCount:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerRating:
          type: number
        status:
          type: string
          enum: [pending, live, ended, sold]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        winnerId:
          type: ["integer", "null"]
        winnerName:
          type: ["string", "null"]
        shippingInfo:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - imageUrl
        - category
        - startingPrice
        - currentBid
        - bidCount
        - sellerId
        - sellerName
        - sellerRating
        - status
        - startTime
        - endTime
        - createdAt

    AuctionDetail:
      allOf:
        - $ref: "#/components/schemas/Auction"
        - type: object
          properties:
            recentBids:
              type: array
              items:
                $ref: "#/components/schemas/Bid"
          required: [recentBids]

    SoldItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        soldAmount:
          type: number
        winnerName:
          type: ["string", "null"]
        winnerId:
          type: ["integer", "null"]
        soldAt:
          type: string
          format: date-time
        shippingInfo:
          type: ["string", "null"]
      required: [id, title, description, imageUrl, category, soldAmount, soldAt]

    CreateAuctionBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        startingPrice:
          type: number
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        shippingInfo:
          type: string
      required: [title, description, imageUrl, category, startingPrice, startTime, endTime]

    UpdateAuctionBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, live, ended, sold]
        endTime:
          type: string
          format: date-time

    AcceptWinnerBody:
      type: object
      properties:
        winnerId:
          type: integer
      required: [winnerId]

    Bid:
      type: object
      properties:
        id:
          type: integer
        auctionId:
          type: integer
        bidderId:
          type: integer
        bidderName:
          type: string
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, auctionId, bidderId, bidderName, amount, createdAt]

    BidWithAuction:
      allOf:
        - $ref: "#/components/schemas/Bid"
        - type: object
          properties:
            auctionTitle:
              type: string
            auctionStatus:
              type: string
            auctionEndTime:
              type: string
              format: date-time
            isWinning:
              type: boolean
          required: [auctionTitle, auctionStatus, auctionEndTime, isWinning]

    PlaceBidBody:
      type: object
      properties:
        amount:
          type: number
      required: [amount]

    SellerStats:
      type: object
      properties:
        totalAuctions:
          type: integer
        activeAuctions:
          type: integer
        totalEarnings:
          type: number
        pendingAuctions:
          type: integer
        soldAuctions:
          type: integer
        totalBidsReceived:
          type: integer
      required:
        - totalAuctions
        - activeAuctions
        - totalEarnings
        - pendingAuctions
        - soldAuctions
        - totalBidsReceived

    AuctionsSummary:
      type: object
      properties:
        liveCount:
          type: integer
        totalBids:
          type: integer
        totalValue:
          type: number
        endingSoon:
          type: integer
      required: [liveCount, totalBids, totalValue, endingSoon]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        bidderName:
          type: string
        auctionTitle:
          type: string
        auctionId:
          type: integer
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, bidderName, auctionTitle, auctionId, amount, createdAt]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
