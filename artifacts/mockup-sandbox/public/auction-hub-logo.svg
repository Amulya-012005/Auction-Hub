<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c1121f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d0208;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="98"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="99" fill="url(#redGrad)" />
  <!-- Inner background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#e63946" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Gavel head (top rectangle rotated) -->
  <g transform="translate(100, 88) rotate(-35)">
    <!-- Gavel head body -->
    <rect x="-22" y="-9" width="44" height="18" rx="4" fill="url(#redGrad)" />
    <!-- Gavel head dark stripe -->
    <rect x="-22" y="-2" width="44" height="4" rx="0" fill="#1a0505" opacity="0.6"/>
    <!-- Gavel head highlight -->
    <rect x="-22" y="-9" width="44" height="5" rx="4" fill="#ff6b6b" opacity="0.3"/>
    <!-- Gavel head end caps -->
    <rect x="-26" y="-11" width="10" height="22" rx="3" fill="#c1121f"/>
    <rect x="16" y="-11" width="10" height="22" rx="3" fill="#c1121f"/>
  </g>

  <!-- Gavel handle -->
  <g transform="translate(100, 88)">
    <rect x="0" y="0" width="36" height="9" rx="4" 
          transform="rotate(-35) translate(-4, 5)" 
          fill="url(#handleGrad)"/>
    <!-- Handle shine -->
    <rect x="0" y="0" width="36" height="3" rx="2" 
          transform="rotate(-35) translate(-4, 5)" 
          fill="#ff9999" opacity="0.2"/>
  </g>

  <!-- Impact lines / sparkles -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="72" y1="62" x2="66" y2="56" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="68" y1="72" x2="60" y2="68" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="76" y1="60" x2="72" y2="52" stroke="#e63946" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Base/anvil -->
  <g transform="translate(100, 118)">
    <rect x="-20" y="0" width="40" height="7" rx="3" fill="#c1121f"/>
    <rect x="-24" y="7" width="48" height="5" rx="2.5" fill="#9d0208"/>
    <rect x="-24" y="7" width="48" height="2" rx="2" fill="#e63946" opacity="0.4"/>
  </g>

  <!-- "AUCTION-HUB" text -->
  <text 
    x="100" 
    y="152" 
    text-anchor="middle" 
    font-family="'Arial Black', 'Arial', sans-serif" 
    font-weight="900" 
    font-size="14.5" 
    letter-spacing="1.5"
    fill="url(#redGrad)"
    filter="url(#glow)"
  >AUCTION-HUB</text>

  <!-- Tagline -->
  <text 
    x="100" 
    y="165" 
    text-anchor="middle" 
    font-family="'Arial', sans-serif" 
    font-weight="400" 
    font-size="6" 
    letter-spacing="1"
    fill="#ffffff"
    opacity="0.6"
  >Fairness first. Every bid counts</text>

  <!-- Decorative bottom arc line -->
  <path d="M 55 170 Q 100 178 145 170" stroke="#e63946" stroke-width="0.8" fill="none" opacity="0.5"/>
</svg>
