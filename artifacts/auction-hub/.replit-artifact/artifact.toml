kind = "web"
previewPath = "/"
title = "Auction Hub"
version = "1.0.0"
id = "artifacts/auction-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21761

[services.development]
run = "pnpm --filter @workspace/auction-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auction-hub", "run", "build" ]
publicDir = "artifacts/auction-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21761"
BASE_PATH = "/"
